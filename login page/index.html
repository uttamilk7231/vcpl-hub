<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory CeraTech - Sign In</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared/glass.css">
</head>
<body>
    <div class="auth-layout">
        <!-- Branding Panel -->
        <aside class="auth-brand">
            <div class="brand-content">
                <div class="brand-logo">
                    <span class="brand-logo-mark">V</span>
                    <span class="brand-logo-text">VCPL</span>
                </div>
                <h2 class="brand-title">Welcome back.</h2>
                <p class="brand-tagline">Sign in to access your workspace.</p>
            </div>
        </aside>

        <!-- Form Panel -->
        <main class="auth-panel">
            <div class="auth-card">
                <h1 class="auth-heading">Welcome Back</h1>
                <p class="auth-subtext">Enter your details below</p>

                <div class="auth-banner" id="auth-banner" role="status" hidden></div>

                <form class="auth-form" id="login-form">
                    <div class="form-field">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="you@company.com" autocomplete="email">
                    </div>

                    <div class="form-field">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="password-eye" id="password-eye" aria-label="Toggle password visibility">
                            <svg class="eye-open" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>

                    <button type="submit" class="cta-btn">Sign in</button>
                </form>

                <p class="forgot-link"><a href="#">Forgot your password?</a></p>

                <div class="divider"><span>Or sign in with</span></div>

                <div class="social-buttons">
                    <button type="button" class="social-btn" id="google-login-btn">
                        <svg class="google-icon" viewBox="0 0 24 24"><path d="M21.8 12.2c0-.7-.06-1.4-.18-2H12v3.8h5.5a4.9 4.9 0 0 1-2.1 3.2v2.7h3.4c2-1.9 3.1-4.6 3.1-7.7z"/><path d="M12 22c2.8 0 5.2-.9 6.9-2.5l-3.4-2.7c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.2H2.7v2.8A10 10 0 0 0 12 22z"/><path d="M6.2 13.6c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7H2.7a10 10 0 0 0 0 9L6.2 13.6z"/><path d="M12 6.5c1.5 0 2.9.5 4 1.6l3-3A10 10 0 0 0 2.7 7l3.5 2.7c.8-2.4 3.1-4.2 5.8-4.2z"/></svg>
                        <span>Google</span>
                    </button>
                </div>

                <p class="auth-alternate">
                    Don't have an account?
                    <a href="../create account/index.html">Get Started</a>
                </p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
</body>
</html>
