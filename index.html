<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">
    <title>Victory CeraTech</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon-192.png">
    <style>
        :root {
            --blue: #2c5fd6;
            --violet: #6d3fdb;
            --purple: #8b5cf6;
            --ink: #0b1020;
            --glass: rgba(255, 255, 255, 0.14);
            --glass-border: rgba(255, 255, 255, 0.35);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: radial-gradient(1200px 600px at 20% 10%, #3b6fe0 0%, transparent 55%),
                        radial-gradient(1000px 700px at 85% 90%, #7c4ddb 0%, transparent 55%),
                        linear-gradient(135deg, var(--blue) 0%, var(--violet) 55%, var(--purple) 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
        }

        /* Soft floating light blobs for depth */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            pointer-events: none;
            animation: float 14s ease-in-out infinite;
        }
        .orb.a { width: 360px; height: 360px; top: -80px; left: -60px;
                 background: radial-gradient(circle, #7aa2ff, transparent 70%); }
        .orb.b { width: 420px; height: 420px; bottom: -120px; right: -80px;
                 background: radial-gradient(circle, #c084fc, transparent 70%); animation-delay: -5s; }
        .orb.c { width: 260px; height: 260px; top: 55%; left: 12%;
                 background: radial-gradient(circle, #67e8f9, transparent 70%); animation-delay: -9s; }

        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50%      { transform: translate3d(24px, -30px, 0) scale(1.08); }
        }

        /* Glass card */
        .card {
            position: relative;
            z-index: 2;
            width: min(92vw, 380px);
            padding: 38px 32px 32px;
            border-radius: 28px;
            text-align: center;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 70px rgba(6, 12, 40, 0.45),
                        inset 0 1px 0 rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo with rotating ring */
        .logo-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
        }
        .ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 30%, rgba(255,255,255,0) 60%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask-composite: exclude;
            animation: spin 2.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
            overflow: hidden;
            animation: breathe 3.2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1);     box-shadow: 0 0 0 0 rgba(255,255,255,0.28), inset 0 1px 0 rgba(255,255,255,0.5); }
            50%      { transform: scale(1.04);  box-shadow: 0 0 0 14px rgba(255,255,255,0.02), inset 0 1px 0 rgba(255,255,255,0.5); }
        }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .monogram {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.35);
        }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.3px;
        }
        .tagline {
            margin: 6px 0 0;
            font-size: 12.5px;
            font-weight: 500;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
        }

        /* Progress bar */
        .bar {
            position: relative;
            height: 6px;
            margin: 26px 0 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }
        .bar::after {
            content: "";
            position: absolute;
            top: 0; left: -40%;
            width: 40%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            animation: slide 1.3s ease-in-out infinite;
        }
        @keyframes slide {
            0%   { left: -40%; }
            100% { left: 100%; }
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
            min-height: 18px;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #7cffcb;
            box-shadow: 0 0 0 0 rgba(124, 255, 203, 0.6);
            animation: pulse 1.6s ease-out infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(124, 255, 203, 0.55); }
            100% { box-shadow: 0 0 0 12px rgba(124, 255, 203, 0); }
        }

        .foot {
            position: absolute;
            bottom: 18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.6);
            z-index: 2;
        }

        @media (prefers-reduced-motion: reduce) {
            .orb, .ring, .logo, .bar::after, .dot { animation: none; }
            .card { animation: none; }
        }
    </style>
</head>
<body>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>

    <main class="card" role="status" aria-live="polite" aria-label="Loading VCPL">
        <div class="logo-wrap">
            <div class="ring"></div>
            <div class="logo">
                <img id="splash-logo" src="/icon-192.png" alt="VCPL">
                <span id="splash-monogram" class="monogram" style="display:none">V</span>
            </div>
        </div>

        <h1>Victory CeraTech</h1>
        <p class="tagline">VCPL Workspace</p>

        <div class="bar"></div>
        <div class="status"><span class="dot"></span><span id="status-text">Preparing your workspace…</span></div>
    </main>

    <div class="foot">Secure member &amp; stock portal</div>

    <script src="splash.js"></script>
    <script src="bootstrap.js"></script>
</body>
</html>
