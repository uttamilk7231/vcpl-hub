<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory CeraTech - Profile</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared/glass.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo" id="logo-toggle" title="Toggle sidebar">
                    <span class="logo-v">
                        <span class="logo-short">V</span>
                        <span class="logo-full">VCPL</span>
                    </span>
                </div>
            </div>

            <a href="../profile/index.html" class="user-profile" title="View profile">
                <div class="user-avatar" id="sidebar-avatar">--</div>
                <div class="user-info">
                    <span class="user-name" id="sidebar-name">Guest</span>
                    <span class="user-role">Admin</span>
                </div>
            </a>

            <nav class="nav-menu">
                <div class="nav-section">
                    <h3 class="nav-title">Menu</h3>
                    <ul class="nav-list">
                        <li class="nav-item">
                            <a href="../home/index.html" class="nav-link">
                                <span class="nav-icon home-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
                                <span>Home</span>
                            </a>
                        </li>
                         <li class="nav-item">
                             <a href="../documents/index.html" class="nav-link">
                                 <span class="nav-icon folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
                                 <span>Documents</span>
                             </a>
                         </li>
                        <li class="nav-item highlighted">
                            <span class="nav-icon settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
                            <span>Settings</span>
                        </li>
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-card">
                <div class="profile-header"></div>

                <div class="profile-avatar" id="profile-avatar">--</div>

                <h1 class="profile-name" id="profile-name">[User Full Name]</h1>

                <div class="contact-section">
                    <div class="contact-row">
                        <span class="contact-label">Phone</span>
                        <span class="contact-value" id="contact-phone">[Phone Number]</span>
                    </div>
                    <div class="contact-row">
                        <span class="contact-label">Email</span>
                        <span class="contact-value" id="contact-email">[Email Address]</span>
                    </div>
                </div>

                <div class="settings-menu">
                    <div class="menu-item">
                        <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></span>
                        <span class="menu-label">Dark mode</span>
                        <span class="toggle-switch" id="dark-mode-toggle" role="switch">
                            <span class="toggle-knob"></span>
                        </span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></span>
                        <span class="menu-label">Profile details</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span>
                        <span class="menu-label">Settings</span>
                    </div>
                    <div class="menu-item">
                        <span class="menu-icon logout-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                        <span class="menu-label logout-label">Log out</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
</body>
</html>
